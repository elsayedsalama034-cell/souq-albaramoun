name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move files
        run: |
          unzip -o souq-albaramoun.zip
          if [ -d "souq-albaramoun" ]; then cp -a souq-albaramoun/. .; rm -rf souq-albaramoun; fi
          for d in */; do if [ -f "${d}pubspec.yaml" ]; then cp -a "${d}"..; rm -rf "$d"; break; fi; done
          rm -f souq-albaramoun.zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Fix old Android project
        run: |
          rm -rf android
          flutter create --project-name souq_albaramoun --org com.souq.albaramoun --platforms=android .
      - name: Set SDK for Android 16
        run: |
          sed -i 's/flutter.minSdkVersion=.*/flutter.minSdkVersion=23/' android/local.properties
          sed -i 's/flutter.targetSdkVersion=.*/flutter.targetSdkVersion=35/' android/local.properties
          sed -i 's/flutter.compileSdkVersion=.*/flutter.compileSdkVersion=35/' android/local.properties
          grep -q "flutter.minSdkVersion" android/local.properties || echo "flutter.minSdkVersion=23" >> android/local.properties
          grep -q "flutter.targetSdkVersion" android/local.properties || echo "flutter.targetSdkVersion=35" >> android/local.properties
          grep -q "flutter.compileSdkVersion" android/local.properties || echo "flutter.compileSdkVersion=35" >> android/local.properties
          cat android/local.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: souq-albaramoun-apk-fast
          path: build/app/outputs/flutter-apk/*.apk
