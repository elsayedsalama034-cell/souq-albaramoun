name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o souq-albaramoun.zip || true
          if [ -d "souq-albaramoun" ]; then cp -a souq-albaramoun/. . 2>/dev/null; rm -rf souq-albaramoun; fi
          for d in */; do if [ -f "${d}pubspec.yaml" ]; then cp -a "${d}".. 2>/dev/null; rm -rf "$d"; break; fi; done
          rm -f souq-albaramoun.zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Recreate android
        run: |
          rm -rf android
          flutter create --project-name souq_albaramoun --org com.souq.albaramoun --platforms=android .
      - name: FIX MINSDK 23
        run: |
          sed -i 's/21/23/g' android/local.properties || true
          find android -name "*.gradle*" -type f -exec sed -i 's/21/23/g' {} \; || true
          cat android/local.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: souq-albaramoun-apk
          path: build/app/outputs/flutter-apk/*.apk
