name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move files
        run: |
          unzip -o souq-albaramoun.zip
          if [ -d "souq-albaramoun" ]; then cp -a souq-albaramoun/. .; rm -rf souq-albaramoun; fi
          for d in */; do if [ -f "${d}pubspec.yaml" ]; then cp -a "${d}"..; rm -rf "$d"; break; fi; done
          rm -f souq-albaramoun.zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
      - name: Fix old Android project
        run: |
          rm -rf android
          flutter create --project-name souq_albaramoun --org com.souq.albaramoun --platforms=android .
      - name: Fix SDK for Android 16
        run: |
          sed -i 's/minSdk.*/minSdk = 23/g' android/app/build.gradle
          sed -i 's/targetSdk.*/targetSdk = 36/g' android/app/build.gradle
          sed -i 's/compileSdk.*/compileSdk = 36/g' android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle
          sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle
          echo "flutter.minSdkVersion=23" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: souq-albaramoun-apk-fast
          path: build/app/outputs/flutter-apk/*.apk
