name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Fix name
        run: |
          unzip -o souq-albaramoun.zip
          # انقل كل حاجة من جوه الفولدر لبره
          if [ -d "souq-albaramoun" ]; then
            cp -rf souq-albaramoun/*.
            cp -rf souq-albaramoun/.*. 2>/dev/null || true
            rm -rf souq-albaramoun
          fi
          echo "قبل التصليح:"
          grep "^name:" pubspec.yaml
          sed -i 's/souq-albaramoun/souq_albaramoun/g' pubspec.yaml
          echo "بعد التصليح:"
          grep "^name:" pubspec.yaml
          rm -rf android
          flutter create --platforms=android .
          sed -i 's/21/23/g' android/local.properties || true
          sed -i 's/minSdk =.*/minSdk = 23/g' android/app/build.gradle.kts || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts || true
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
