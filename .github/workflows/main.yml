name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move files
        run: |
          unzip -o souq-albaramoun.zip
          if [ -d "souq-albaramoun" ]; then cp -a souq-albaramoun/. .; rm -rf souq-albaramoun; fi
          for d in */; do if [ -f "${d}pubspec.yaml" ]; then cp -a "${d}"..; rm -rf "$d"; break; fi; done
          rm -f souq-albaramoun.zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Fix old Android project
        run: |
          rm -rf android
          flutter create --project-name souq_albaramoun --org com.souq.albaramoun --platforms=android .
      - name: Fix SDK for Android 16
        run: |
          echo "flutter.minSdkVersion=23" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties
          find android -name "build.gradle" -exec sed -i 's/minSdkVersion.*/minSdkVersion 23/g' {} \;
          find android -name "build.gradle" -exec sed -i 's/targetSdkVersion.*/targetSdkVersion 35/g' {} \;
          find android -name "build.gradle.kts" -exec sed -i 's/minSdk.*/minSdk = 23/g' {} \;
          find android -name "build.gradle.kts" -exec sed -i 's/targetSdk.*/targetSdk = 35/g' {} \;
          find android -name "build.gradle.kts" -exec sed -i 's/compileSdk.*/compileSdk = 35/g' {} \;
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: souq-albaramoun-apk-fast
          path: build/app/outputs/flutter-apk/*.apk
