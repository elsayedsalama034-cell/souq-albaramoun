name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Fix name and build
        run: |
          unzip -o souq-albaramoun.zip || true
          rm -rf souq-albaramoun
          # صلح اسم الباكدج من - لـ _
          sed -i 's/name: souq-albaramoun/name: souq_albaramoun/g' pubspec.yaml
          sed -i 's/name: souq-albaramoun/name: souq_albaramoun/g' pubspec.yaml
          cat pubspec.yaml | head -5
          rm -rf android
          flutter create --platforms=android .
          sed -i 's/21/23/g' android/local.properties
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts
          sed -i 's/minSdk =.*/minSdk = 23/g' android/app/build.gradle.kts
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
