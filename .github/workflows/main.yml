name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o souq-albaramoun.zip
          if [ -d "souq-albaramoun" ]; then cp -a souq-albaramoun/. .; rm -rf souq-albaramoun; fi
          for d in */; do if [ -f "${d}pubspec.yaml" ]; then cp -a "${d}"..; rm -rf "$d"; break; fi; done
          rm -f souq-albaramoun.zip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Recreate android
        run: |
          rm -rf android
          flutter create --project-name souq_albaramoun --org com.souq.albaramoun --platforms=android .
      - run: flutter pub get
      - name: FIX MINSDK 23 FOR REAL
        run: |
          # 1- امسح الكاش
          flutter clean
          # 2- اكتب القيم صح بالعافية
          cat > android/local.properties <<EOF
          sdk.dir=/usr/local/lib/android/sdk
          flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.24.5-x64
          flutter.minSdkVersion=23
          flutter.targetSdkVersion=35
          flutter.compileSdkVersion=35
          flutter.ndkVersion=27.0.12077973
          flutter.buildMode=release
          EOF
          # 3- غير ملف البناء نفسه لـ 23 ثابت
          sed -i 's/minSdk =.*/minSdk = 23/' android/app/build.gradle.kts
          sed -i 's/minSdkVersion.*/minSdkVersion 23/' android/app/build.gradle
          echo "--- CHECK ---"
          cat android/local.properties
          grep -n "minSdk" android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: souq-albaramoun-android16
          path: build/app/outputs/flutter-apk/*.apk
