name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Build APK
        run: |
          unzip -o souq-albaramoun.zip
          echo "=== بنشوف ايه جوه ==="
          ls -la
          if [ -d "souq-albaramoun" ]; then
            echo "لقينا الفولدر souq-albaramoun، هنصلحه جوه الاول"
            sed -i 's/souq-albaramoun/souq_albaramoun/g' souq-albaramoun/pubspec.yaml
            cp -rf souq-albaramoun/. .
            rm -rf souq-albaramoun
          fi
          echo "=== اسم الباكدج دلوقتي ==="
          grep "^name:" pubspec.yaml
          sed -i 's/souq-albaramoun/souq_albaramoun/g' pubspec.yaml
          grep "^name:" pubspec.yaml
          rm -rf android
          flutter create --platforms=android .
          sed -i 's/21/23/g' android/local.properties
          sed -i 's/minSdk =.*/minSdk = 23/g' android/app/build.gradle.kts
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
